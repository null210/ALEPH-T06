# 푸시할 때마다 체크리스트 테스트와 비밀키 검사를 돌린다.
name: 검사
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Git 기록 전체를 받아 비밀키 검사에 쓴다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:secrets
